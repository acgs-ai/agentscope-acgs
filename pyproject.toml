[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscope-acgs"
version = "0.1.0"
description = "ACGS rule-based tool-call governance for AgentScope agents, via agent middleware"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Martin Lyu" }]
keywords = ["agentscope", "agents", "ai", "middleware", "human-in-the-loop", "tool-calls", "governance", "acgs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "agentscope>=2.0.6,<2.1",
    "acgs-lite>=3.0.1,<4",
]

[project.urls]
Homepage = "https://github.com/acgs-ai/agentscope-acgs"
Documentation = "https://github.com/acgs-ai/agentscope-acgs#readme"
Repository = "https://github.com/acgs-ai/agentscope-acgs"
Issues = "https://github.com/acgs-ai/agentscope-acgs/issues"
Changelog = "https://github.com/acgs-ai/agentscope-acgs/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
]
lint = ["ruff>=0.15.0,<0.16.0"]
typing = ["mypy>=1.18.0,<2.0.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
    "commitizen>=4.0.0,<5.0.0",
    "pre-commit>=4.0.0,<5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentscope_acgs"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

# Hatch environments install the same dependency groups as `uv sync` (uv.lock pins them for CI).
[tool.hatch.envs.default]
installer = "uv"
dependency-groups = ["test", "lint", "typing"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
cov = "pytest --cov --cov-report=term-missing {args}"
lint = ["ruff check src tests examples", "ruff format --check src tests examples"]
format = ["ruff check --fix --exit-zero src tests examples", "ruff format src tests examples"]
fmt = ["format"]
typecheck = "mypy"
prepare = ["format", "lint", "typecheck", "cov"]

# The oldest supported versions of agentscope and acgs-lite. CI resolves the same set with
# `uv pip install --resolution lowest-direct`.
[tool.hatch.envs.min]
template = "default"
python = "3.11"
extra-dependencies = ["agentscope==2.0.6", "acgs-lite==3.0.1"]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "D", "E", "EM", "F", "FA", "FBT", "I", "N", "PERF", "PGH", "PIE", "PL",
    "PT", "PYI", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "T20", "TC", "TID", "UP", "W",
]
ignore = [
    "TC001", "TC002", "TC003",  # runtime imports keep the public API introspectable
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Shared verbatim with the other ACGS adapters (acgs-haystack, strands-acgs, langchain-acgs, crewai-acgs, adk-acgs,
# pydantic-ai-acgs, openai-agents-acgs, agent-framework-acgs, beeai-acgs and others), which use Sphinx-style docstrings here.
"src/agentscope_acgs/_governance.py" = ["D212", "D205", "D415", "RUF100", "BLE001", "ANN401"]
"src/agentscope_acgs/middleware.py" = ["BLE001", "ANN401"]
"tests/**/*.py" = ["D", "S101", "PLR2004", "ANN401", "ARG", "SLF001", "FBT", "PLC0415", "EM101", "N802"]
"examples/**/*.py" = ["T201", "D", "ARG", "ANN401", "PLR2004", "FBT"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]

# Recent numpy stubs (a transitive dependency of agentscope) use Python 3.12 syntax that mypy rejects when checking
# for Python 3.11. Nothing here uses numpy, so mypy does not read it.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--strict-markers --strict-config --doctest-modules --import-mode=importlib --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::ImportWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["agentscope_acgs"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
